services:
  node0:
    image: raft-node:latest
    container_name: node0
    hostname: node0
    command:
      - --debug
      - --timeout-interval
      - "1500"
      - --heart-beat-interval
      - "1000"
      - --id
      - "00000000-0000-0000-0000-000000000001"
    ports:
      - "7195:7195"
    build:
      context: ../../../..
      dockerfile: ./src/RaftConsensusOnAspnet.RaftConsensus/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:7195
    volumes:
      - ./RaftNodeConfigs/cluster.settings.json:/app/configs/cluster.settings.json:ro
    depends_on:
      - toxiproxy0
      - toxiproxy1
      - toxiproxy2
      - toxiproxy3
      - toxiproxy4
    networks:
      - raft-net

